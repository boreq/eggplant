version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - modernize
    - noctx
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*github.com/gorilla/websocket.Conn).Close
        - (*os.Process).Kill
