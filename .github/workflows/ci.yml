name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  check-backend:
    name: Check backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
          cache-dependency-path: backend/go.sum

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: make ci

  check-frontend:
    name: Check frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Run CI
        run: make ci

  build-release-binary:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: [check-backend, check-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
          cache-dependency-path: backend/go.sum

      - name: Build release binary
        run: make build

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: eggplant-linux-amd64
          path: eggplant
          if-no-files-found: error
