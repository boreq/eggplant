name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Run tests
        run: make ci

  release-binary:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:

      - name: Check out code
        uses: actions/checkout@v6

      - name: Compute version
        id: version
        run: echo "version=$(make version)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Enable corepack
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --immutable

      - name: Build frontend
        working-directory: frontend
        env:
          VUE_APP_VERSION: ${{ steps.version.outputs.version }}
        run: yarn build

      - name: Stage frontend into backend embed directory
        run: cp -r frontend/dist/. backend/entrypoints/http/frontend/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26

      - name: Build backend with embedded frontend
        working-directory: backend
        run: |
          mkdir -p _build
          go build -tags withfrontend \
            -ldflags "-X github.com/boreq/eggplant/entrypoints/http.Version=${{ steps.version.outputs.version }}" \
            -o ./_build/eggplant ./cmd/eggplant

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eggplant-linux-amd64
          path: backend/_build/eggplant
          if-no-files-found: error
